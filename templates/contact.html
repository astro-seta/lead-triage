<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contact Us</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 3rem auto; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 10px 18px; }
    .thanks { background: #dcfce7; border: 1px solid #16a34a; padding: 12px; border-radius: 6px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  {% if sent %}
    <div class="thanks"><b>Thank you! We received your message.</b></div>
  {% endif %}
  <form method="post" action="/contact">
    <label>Name</label>
    <input name="name" required>
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Message</label>
    <textarea name="message" rows="5" required></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
